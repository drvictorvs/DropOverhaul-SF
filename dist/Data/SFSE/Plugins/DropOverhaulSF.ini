; Drop Overhaul SF
;
; Changes here take effect the next time the game starts.
;
; With OSF Settings installed, use its settings page instead (Drop Overhaul): its values replace the
; ones here, changes there apply while the game runs, and pick up / place, put back, upright and
; drops/stays come through OSF's own input handling (mouse buttons included).
;
; Keys are Windows virtual-key codes, in decimal or hex (0x..), 0 = off. Common ones:
;   0x04 middle mouse   0x05 mouse button 4   0x06 mouse button 5
;   0x60-0x69 numpad 0-9   0x6A numpad *   0x6B numpad +   0x6D numpad -   0x6E numpad .   0x6F numpad /
;   0x21 PageUp   0x22 PageDown   0x24 Home   0x23 End   0x2D Insert   0x2E Delete   0x12 Alt
; The game still sees these keys too, so pick ones it doesn't use.

[Keys]
; Pick up what you're looking at (whatever the "E) Take" prompt is for); press again to place it.
iGrabKey = 0x04
; Put the held object back where it was.
iCancelKey = 0x2E
; Turn the held object.
iYawLeftKey = 0x64
iYawRightKey = 0x66
iPitchUpKey = 0x68
iPitchDownKey = 0x62
iRollLeftKey = 0x67
iRollRightKey = 0x69
; Upright, facing the same way as you.
iResetRotationKey = 0x65
; Farther from you / closer to you.
iPushKey = 0x6B
iPullKey = 0x6D
; Higher / lower than your line of sight.
iRaiseKey = 0x21
iLowerKey = 0x22
; Hold for slow, fine adjustments.
iFineKey = 0x12
; Switch the held object between dropping when placed and staying exactly where placed.
iFreezeToggleKey = 0x6E

[Placement]
; 1 = when placed, physics takes over and the object settles onto whatever is below it.
; 0 = the object stays exactly where you placed it, even in mid-air. It stays there until the
;     area reloads (leaving and coming back, or loading a save); then physics takes over again.
bDropOnPlace = 1
; 1 = the held object turns with you, keeping the same side towards you.
bRotateWithView = 1
; 1 = also move objects that have no physics (some furniture and clutter). Their collision may
; not follow the 3D, so use with care.
bAllowStatic = 0
; Degrees per second.
fRotateSpeed = 90
; Game units per second, for distance and height.
fMoveSpeed = 150
; Speed while iFineKey is held, as a fraction of the normal speed.
fFineMultiplier = 0.2
; Closest and farthest the held object can be, in game units from the camera.
fMinDistance = 40
fMaxDistance = 1000

[General]
; HUD messages: "Holding", "Put back", "Can't move that", and so on.
bNotifications = 1
; Extra details in Documents\My Games\Starfield\SFSE\Logs\DropOverhaulSF.log (for troubleshooting).
bDebugLog = 0
