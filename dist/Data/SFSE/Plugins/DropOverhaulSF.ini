; Drop Overhaul SF
;
; Changes here take effect the next time the game starts.
;
; With OSF Settings installed, use its settings page instead (Drop Overhaul): its values replace the
; ones here (except bDebugLog), and changes there apply while the game runs.
;
; Keys are Windows virtual-key codes, in decimal or hex (0x..), 0 = off. Common ones:
;   0x01 left mouse   0x02 right mouse   0x04 middle mouse   0x05 mouse button 4   0x06 mouse button 5
;   0x10 Shift   0x11 Ctrl   0x12 Alt   0x20 Space   0x09 Tab
;   0x60-0x69 numpad 0-9   0x6A numpad *   0x6B numpad +   0x6D numpad -   0x6E numpad .   0x6F numpad /
;   0x21 PageUp   0x22 PageDown   0x24 Home   0x23 End   0x2D Insert   0x2E Delete   0x12 Alt
; While an object is held, the game doesn't get E, the mouse buttons and wheel, or the place, put back,
; turn, raise, advanced and reset keys. It still sees the other keys, so pick ones it doesn't use.

[Keys]
; Pick up what you're looking at (whatever the "E) Take" prompt is for); press again to place it.
iGrabKey = 0x04
; Place the held object (E, the game's Activate key, places it too).
iPlaceKey = 0x01
; Put the held object back where it was.
iCancelKey = 0x02
; Hold: moving the mouse turns the object instead of the camera (and tilts it, in advanced mode).
iRotateModifierKey = 0x11
; Hold: moving the mouse up and down raises and lowers it (and left and right moves it sideways,
; in advanced mode).
iMoveModifierKey = 0x10
; Switch advanced mode for the held object.
iAdvancedModeKey = 0x20
; Turn the held object.
iYawLeftKey = 0x64
iYawRightKey = 0x66
iPitchUpKey = 0x68
iPitchDownKey = 0x62
iRollLeftKey = 0x67
iRollRightKey = 0x69
; Undo turning and moving (with the turn or raise key held, only that one).
iResetRotationKey = 0x09
; Farther from you / closer to you.
iPushKey = 0x6B
iPullKey = 0x6D
; Higher / lower than your line of sight.
iRaiseKey = 0x21
iLowerKey = 0x22
; Hold for slow, fine adjustments.
iFineKey = 0x12
; Switch the held object between dropping when placed and staying exactly where placed.
iFreezeToggleKey = 0x6E

[Placement]
; 0 = builder mode: the object sits on whatever you aim at, like the outpost and ship builders.
; 1 = hold mode: it's held in the air in front of you, at the distance you picked it up from.
bHoldMode = 0
; Degrees per mouse step with the turn key held.
fMouseRotateSpeed = 0.3
; Meters per mouse step with the raise key held.
fMouseMoveSpeed = 0.002
; Degrees per mouse-wheel notch. 0 leaves the mouse wheel to the game.
fWheelRotateStep = 15
; 1 = when placed, physics takes over and the object settles onto whatever is below it.
; 0 = the object stays exactly where you placed it, even in mid-air. It stays there until the
;     area reloads (leaving and coming back, or loading a save); then physics takes over again.
bDropOnPlace = 1
; 1 = the held object turns with you, keeping the same side towards you.
bRotateWithView = 1
; 1 = also move objects that have no physics (some furniture and clutter). Their collision may
; not follow the 3D, so use with care.
bAllowStatic = 0
; Degrees per second.
fRotateSpeed = 90
; Meters per second, for distance and height (Starfield measures distances in meters).
fMoveSpeedMeters = 1.0
; Speed while iFineKey is held, as a fraction of the normal speed.
fFineMultiplier = 0.2
; Closest and farthest the held object can be, in meters from the camera.
fMinDistanceMeters = 0.5
fMaxDistanceMeters = 10

[General]
; HUD messages: "Holding", "Put back", "Can't move that", and so on.
bNotifications = 1
; Extra details in Documents\My Games\Starfield\SFSE\Logs\DropOverhaulSF.log (for troubleshooting):
; every key and button press the game receives, and the camera and object positions at each pickup.
; Read from here even with OSF Settings installed.
bDebugLog = 0
